    <script>

      function goBack() {
            // This will take the user back to the previous page in their history
            window.history.back();
            
            // Alternatively, you can specify a specific URL:
            // window.location.href = "https://example.com/previous-page";
        }

        
        // Calculator state
        let currentInput = '0';
        let expression = '';
        let result = 0;
        let memory = 0;
        let isShift = false;
        let isAlpha = false;
        let isOn = true;
        let angleMode = 'DEG'; // DEG, RAD, GRAD
        let currentMode = 'COMP'; // COMP, STAT, MATRIX, COMPLEX
        let isComplexMode = false;
        let lastAnswer = 0;
        let statData = [];
        let matrices = {};
        let currentMatrix = null;
        
        // DOM elements
        const resultDisplay = document.getElementById('result');
        const expressionDisplay = document.getElementById('expression');
        const shiftBtn = document.getElementById('shiftBtn');
        const alphaBtn = document.getElementById('alphaBtn');
        const modeBtn = document.getElementById('modeBtn');
        
        // Complex number class
        class Complex {
            constructor(real, imaginary) {
                this.real = real;
                this.imaginary = imaginary;
            }
            
            toString() {
                if (this.imaginary === 0) return this.real.toString();
                if (this.real === 0) return `${this.imaginary}i`;
                return `${this.real}${this.imaginary >= 0 ? '+' : ''}${this.imaginary}i`;
            }
            
            add(other) {
                return new Complex(this.real + other.real, this.imaginary + other.imaginary);
            }
            
            subtract(other) {
                return new Complex(this.real - other.real, this.imaginary - other.imaginary);
            }
            
            multiply(other) {
                const real = this.real * other.real - this.imaginary * other.imaginary;
                const imaginary = this.real * other.imaginary + this.imaginary * other.real;
                return new Complex(real, imaginary);
            }
            
            divide(other) {
                const denominator = other.real * other.real + other.imaginary * other.imaginary;
                const real = (this.real * other.real + this.imaginary * other.imaginary) / denominator;
                const imaginary = (this.imaginary * other.real - this.real * other.imaginary) / denominator;
                return new Complex(real, imaginary);
            }
            
            magnitude() {
                return Math.sqrt(this.real * this.real + this.imaginary * this.imaginary);
            }
            
            angle() {
                return Math.atan2(this.imaginary, this.real);
            }
            
            conjugate() {
                return new Complex(this.real, -this.imaginary);
            }
        }
        
        // Matrix class
        class Matrix {
            constructor(rows, cols, data) {
                this.rows = rows;
                this.cols = cols;
                this.data = data || Array(rows).fill().map(() => Array(cols).fill(0));
            }
            
            toString() {
                return `Matrix ${this.rows}x${this.cols}`;
            }
            
            add(other) {
                if (this.rows !== other.rows || this.cols !== other.cols) {
                    throw new Error('Matrix dimensions must match for addition');
                }
                
                const result = new Matrix(this.rows, this.cols);
                for (let i = 0; i < this.rows; i++) {
                    for (let j = 0; j < this.cols; j++) {
                        result.data[i][j] = this.data[i][j] + other.data[i][j];
                    }
                }
                return result;
            }
            
            multiply(other) {
                if (this.cols !== other.rows) {
                    throw new Error('Number of columns in first matrix must equal number of rows in second matrix');
                }
                
                const result = new Matrix(this.rows, other.cols);
                for (let i = 0; i < this.rows; i++) {
                    for (let j = 0; j < other.cols; j++) {
                        let sum = 0;
                        for (let k = 0; k < this.cols; k++) {
                            sum += this.data[i][k] * other.data[k][j];
                        }
                        result.data[i][j] = sum;
                    }
                }
                return result;
            }
            
            determinant() {
                if (this.rows !== this.cols) {
                    throw new Error('Matrix must be square to calculate determinant');
                }
                
                if (this.rows === 1) return this.data[0][0];
                if (this.rows === 2) {
                    return this.data[0][0] * this.data[1][1] - this.data[0][1] * this.data[1][0];
                }
                
                let det = 0;
                for (let i = 0; i < this.cols; i++) {
                    const minor = this.getMinor(0, i);
                    det += (i % 2 === 0 ? 1 : -1) * this.data[0][i] * minor.determinant();
                }
                return det;
            }
            
            getMinor(row, col) {
                const minor = new Matrix(this.rows - 1, this.cols - 1);
                let minorRow = 0;
                
                for (let i = 0; i < this.rows; i++) {
                    if (i === row) continue;
                    let minorCol = 0;
                    for (let j = 0; j < this.cols; j++) {
                        if (j === col) continue;
                        minor.data[minorRow][minorCol] = this.data[i][j];
                        minorCol++;
                    }
                    minorRow++;
                }
                return minor;
            }
            
            inverse() {
                const det = this.determinant();
                if (det === 0) throw new Error('Matrix is singular and cannot be inverted');
                
                const cofactorMatrix = new Matrix(this.rows, this.cols);
                for (let i = 0; i < this.rows; i++) {
                    for (let j = 0; j < this.cols; j++) {
                        const minor = this.getMinor(i, j);
                        cofactorMatrix.data[i][j] = ((i + j) % 2 === 0 ? 1 : -1) * minor.determinant();
                    }
                }
                
                const adjugate = cofactorMatrix.transpose();
                const inverse = new Matrix(this.rows, this.cols);
                for (let i = 0; i < this.rows; i++) {
                    for (let j = 0; j < this.cols; j++) {
                        inverse.data[i][j] = adjugate.data[i][j] / det;
                    }
                }
                return inverse;
            }
            
            transpose() {
                const result = new Matrix(this.cols, this.rows);
                for (let i = 0; i < this.rows; i++) {
                    for (let j = 0; j < this.cols; j++) {
                        result.data[j][i] = this.data[i][j];
                    }
                }
                return result;
            }
        }
        
        // Update display
        function updateDisplay() {
            if (!isOn) {
                resultDisplay.textContent = '';
                expressionDisplay.textContent = '';
                return;
            }
            
            resultDisplay.textContent = currentInput;
            expressionDisplay.textContent = expression;
            
            // Update button states
            shiftBtn.classList.toggle('active-mode', isShift);
            alphaBtn.classList.toggle('active-mode', isAlpha);
            modeBtn.classList.toggle('active-mode', currentMode !== 'COMP');
        }
        
        // Power functions
        function powerOn() {
            isOn = true;
            currentInput = '0';
            expression = '';
            updateDisplay();
        }
        
        function powerOff() {
            isOn = false;
            updateDisplay();
        }
        
        // Mode functions
        function handleShift() {
            isShift = !isShift;
            updateDisplay();
        }
        
        function handleAlpha() {
            isAlpha = !isAlpha;
            updateDisplay();
        }
        
        function handleMode() {
            const modes = ['COMP', 'STAT', 'MATRIX', 'COMPLEX'];
            const currentIndex = modes.indexOf(currentMode);
            currentMode = modes[(currentIndex + 1) % modes.length];
            
            if (currentMode === 'COMPLEX') {
                isComplexMode = true;
            } else {
                isComplexMode = false;
            }
            
            updateDisplay();
        }
        
        // Input handling
        function appendToInput(value) {
            if (!isOn) return;
            
            if (currentInput === '0' && value !== '.') {
                currentInput = value;
            } else {
                currentInput += value;
            }
            
            updateDisplay();
        }
        
        // Calculation with proper operator precedence
        function calculate() {
            if (!isOn) return;
            
            try {
                // Replace special symbols for evaluation
                let evalExpression = expression + currentInput;
                evalExpression = evalExpression.replace(/×/g, '*').replace(/÷/g, '/');
                
                // Handle percentage
                evalExpression = evalExpression.replace(/%/g, '/100');
                
                // Handle complex numbers
                if (isComplexMode && evalExpression.includes('i')) {
                    const complexResult = evaluateComplexExpression(evalExpression);
                    currentInput = complexResult.toString();
                    lastAnswer = complexResult;
                } 
                // Handle matrices
                else if (currentMode === 'MATRIX' && currentMatrix) {
                    // Matrix operations would be handled here
                    currentInput = currentMatrix.toString();
                }
                // Normal calculation
                else {
                    // Use a proper expression evaluator with operator precedence
                    result = evaluateExpression(evalExpression);
                    currentInput = result.toString();
                    lastAnswer = result;
                }
                
                expression = '';
            } catch (e) {
                currentInput = 'Error';
                console.error(e);
            }
            
            updateDisplay();
        }
        
        // Proper expression evaluator with operator precedence
        function evaluateExpression(expr) {
            // Tokenize the expression
            const tokens = tokenize(expr);
            
            // Convert to RPN (Reverse Polish Notation)
            const rpn = shuntingYard(tokens);
            
            // Evaluate RPN
            return evaluateRPN(rpn);
        }
        
        function tokenize(expr) {
            const regex = /(\d+\.?\d*|\.\d+)|([+\-*/^()])|([a-zA-Z]+)/g;
            const tokens = [];
            let match;
            
            while ((match = regex.exec(expr)) !== null) {
                if (match[1]) {
                    tokens.push({ type: 'number', value: parseFloat(match[1]) });
                } else if (match[2]) {
                    tokens.push({ type: 'operator', value: match[2] });
                } else if (match[3]) {
                    tokens.push({ type: 'function', value: match[3] });
                }
            }
            
            return tokens;
        }
        
        function shuntingYard(tokens) {
            const output = [];
            const operators = [];
            const precedence = { '^': 4, '*': 3, '/': 3, '+': 2, '-': 2 };
            
            for (const token of tokens) {
                if (token.type === 'number') {
                    output.push(token);
                } else if (token.type === 'function') {
                    operators.push(token);
                } else if (token.value === '(') {
                    operators.push(token);
                } else if (token.value === ')') {
                    while (operators.length && operators[operators.length - 1].value !== '(') {
                        output.push(operators.pop());
                    }
                    operators.pop(); // Remove the '('
                    if (operators.length && operators[operators.length - 1].type === 'function') {
                        output.push(operators.pop());
                    }
                } else { // operator
                    while (
                        operators.length &&
                        operators[operators.length - 1].value !== '(' &&
                        precedence[operators[operators.length - 1].value] >= precedence[token.value]
                    ) {
                        output.push(operators.pop());
                    }
                    operators.push(token);
                }
            }
            
            while (operators.length) {
                output.push(operators.pop());
            }
            
            return output;
        }
        
        function evaluateRPN(rpn) {
            const stack = [];
            
            for (const token of rpn) {
                if (token.type === 'number') {
                    stack.push(token.value);
                } else if (token.type === 'function') {
                    const arg = stack.pop();
                    let result;
                    
                    switch (token.value.toLowerCase()) {
                        case 'sin':
                            result = Math.sin(convertAngle(arg));
                            break;
                        case 'cos':
                            result = Math.cos(convertAngle(arg));
                            break;
                        case 'tan':
                            result = Math.tan(convertAngle(arg));
                            break;
                        case 'log':
                            result = Math.log10(arg);
                            break;
                        case 'ln':
                            result = Math.log(arg);
                            break;
                        case 'sqrt':
                            result = Math.sqrt(arg);
                            break;
                        case 'abs':
                            result = Math.abs(arg);
                            break;
                        default:
                            throw new Error(`Unknown function: ${token.value}`);
                    }
                    
                    stack.push(result);
                } else { // operator
                    const b = stack.pop();
                    const a = stack.pop();
                    let result;
                    
                    switch (token.value) {
                        case '+':
                            result = a + b;
                            break;
                        case '-':
                            result = a - b;
                            break;
                        case '*':
                            result = a * b;
                            break;
                        case '/':
                            result = a / b;
                            break;
                        case '^':
                            result = Math.pow(a, b);
                            break;
                        default:
                            throw new Error(`Unknown operator: ${token.value}`);
                    }
                    
                    stack.push(result);
                }
            }
            
            if (stack.length !== 1) {
                throw new Error('Invalid expression');
            }
            
            return stack[0];
        }
        
        function convertAngle(value) {
            if (angleMode === 'DEG') return value * Math.PI / 180;
            if (angleMode === 'GRAD') return value * Math.PI / 200;
            return value; // RAD
        }
        
        // Complex number evaluation
        function evaluateComplexExpression(expr) {
            // This is a simplified version - a full implementation would need a proper parser
            const parts = expr.split(/([+\-])/);
            let real = 0;
            let imaginary = 0;
            
            for (let i = 0; i < parts.length; i++) {
                if (parts[i] === '+' || parts[i] === '-' || parts[i] === '') continue;
                
                const term = parts[i];
                const sign = i > 0 ? parts[i - 1] : '+';
                const multiplier = sign === '+' ? 1 : -1;
                
                if (term.includes('i')) {
                    const num = term.replace('i', '') || '1';
                    imaginary += multiplier * parseFloat(num);
                } else {
                    real += multiplier * parseFloat(term);
                }
            }
            
            return new Complex(real, imaginary);
        }
        
        // Calculator functions
        function handleAc() {
            currentInput = '0';
            expression = '';
            updateDisplay();
        }

            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }
        
        function handleAns() {
            if (lastAnswer instanceof Complex) {
                currentInput = lastAnswer.toString();
            } else {
                currentInput = lastAnswer.toString();
            }
            updateDisplay();
        }
        
        // Trigonometric functions
        function handleSin() {
            if (isShift) {
                handleSinMinus1();
                return;
            }
            
            let value = parseFloat(currentInput);
            value = convertAngle(value);
            currentInput = Math.sin(value).toString();
            updateDisplay();
        }
        
        function handleCos() {
            if (isShift) {
                handleCosMinus1();
                return;
            }
            
            let value = parseFloat(currentInput);
            value = convertAngle(value);
            currentInput = Math.cos(value).toString();
            updateDisplay();
        }
        
        function handleTan() {
            if (isShift) {
                handleTanMinus1();
                return;
            }
            
            let value = parseFloat(currentInput);
            value = convertAngle(value);
            currentInput = Math.tan(value).toString();
            updateDisplay();
        }
        
        function handleSinMinus1() {
            let value = parseFloat(currentInput);
            value = Math.asin(value);
            value = convertFromRadians(value);
            currentInput = value.toString();
            updateDisplay();
        }
        
        function handleCosMinus1() {
            let value = parseFloat(currentInput);
            value = Math.acos(value);
            value = convertFromRadians(value);
            currentInput = value.toString();
            updateDisplay();
        }
        
        function handleTanMinus1() {
            let value = parseFloat(currentInput);
            value = Math.atan(value);
            value = convertFromRadians(value);
            currentInput = value.toString();
            updateDisplay();
        }
        
        function convertFromRadians(value) {
            if (angleMode === 'DEG') return value * 180 / Math.PI;
            if (angleMode === 'GRAD') return value * 200 / Math.PI;
            return value;
        }
        
        function handleHyp() {
            // Hyperbolic functions would be implemented here
            alert('Hyperbolic functions not implemented in this demo');
        }
        
        // Logarithmic functions
        function handleLog() {

            updateDisplay();
        }
        
        function handleLn() {
            currentInput = Math.log(parseFloat(currentInput)).toString();
            updateDisplay();
        }
        
        // Power functions
        function handleSquare() {
            currentInput = (parseFloat(currentInput) ** 2).toString();
            updateDisplay();
        }
        
        function handleSqrt() {
            currentInput = Math.sqrt(parseFloat(currentInput)).toString();
            updateDisplay();
        }
        
        function handleXCubed() {
            currentInput = (parseFloat(currentInput) ** 3).toString();
            updateDisplay();
        }
        
        function handleExp() {
            currentInput = (10 ** parseFloat(currentInput)).toString();
            updateDisplay();
        }
        
        function handleEToX() {
            currentInput = Math.exp(parseFloat(currentInput)).toString();
            updateDisplay();
        }
        
        // Memory functions
        function handleMplus() {
            memory += parseFloat(currentInput);
        }
        
        function handleMminus() {
            memory -= parseFloat(currentInput);
        }
        
        function handleSto() {
            memory = parseFloat(currentInput);
        }
        
        function handleRcl() {
            currentInput = memory.toString();
            updateDisplay();
        }
        
        // Complex number functions
        function handleComplex() {
            isComplexMode = !isComplexMode;
            updateDisplay();
        }
        
        function handleArg() {
            if (!isComplexMode) return;
            const complex = parseComplex(currentInput);
            currentInput = complex.angle().toString();
            updateDisplay();
        }
        
        function handleAbs() {
            if (isComplexMode) {
                const complex = parseComplex(currentInput);
                currentInput = complex.magnitude().toString();
            } else {
                currentInput = Math.abs(parseFloat(currentInput)).toString();
            }
            updateDisplay();
        }
        
        function parseComplex(str) {
            str = str.replace(/\s+/g, '');
            const match = str.match(/^([+\-]?\d*\.?\d*)([+\-]\d*\.?\d*)i$/);
            
            if (match) {
                const real = match[1] ? parseFloat(match[1]) : 0;
                const imaginary = parseFloat(match[2]);
                return new Complex(real, imaginary);
            }
            
            // Pure imaginary or real
            if (str.includes('i')) {
                const num = str.replace('i', '') || '1';
                return new Complex(0, parseFloat(num));
            }
            
            return new Complex(parseFloat(str), 0);
        }
        
        // Statistical functions
        function handleStat() {
            if (currentMode !== 'STAT') {
                currentMode = 'STAT';
                statData = [];
                currentInput = 'STAT Mode';
            } else {
                // Add current input to statistical data
                const num = parseFloat(currentInput);
                if (!isNaN(num)) {
                    statData.push(num);
                    currentInput = `Data: ${statData.length} items`;
                }
            }
            updateDisplay();
        }
        
        // Matrix functions
        function handleMatrix() {
            if (currentMode !== 'MATRIX') {
                currentMode = 'MATRIX';
                currentMatrix = new Matrix(2, 2); // Default 2x2 matrix
                currentInput = 'MATRIX Mode';
            } else {
                // Matrix operations would be handled here
                currentInput = currentMatrix.toString();
            }
            updateDisplay();
        }
        
        // Other functions
        function handleExpNotation() {
            appendToInput('e');
        }
        
        function handleFraction() {
            appendToInput('/');
        }
        
        function handleDec() {
            // Switch to decimal mode
            currentInput = 'DEC Mode';
            updateDisplay();
        }
        
        function handleHex() {
            // Switch to hexadecimal mode
            currentInput = 'HEX Mode';
            updateDisplay();
        }
        
        function handleBin() {
            // Switch to binary mode
            currentInput = 'BIN Mode';
            updateDisplay();
        }
        
        // Initialize calculator
        powerOn();
    </script>
</body>
</html>
